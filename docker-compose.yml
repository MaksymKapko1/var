services:
  gridbot:
    build: .
    image: variational-gridbot:latest
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 30s   # время на отмену ордеров при остановке
    volumes:
      - ./data:/data        # состояние сетки (state.json) переживает рестарты
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
